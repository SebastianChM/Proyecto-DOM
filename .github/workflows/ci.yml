name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Security Code Scan
        run: npm run security:scan

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Run TypeCheck
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Run Tests
        run: npm test --workspace=apps/api

  prisma:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    env:
      # Dummy URL — prisma validate resolves env("DATABASE_URL") but never connects
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Check for pending migrations
        run: npx prisma migrate diff --from-schema-datamodel packages/database/prisma/schema.prisma --to-schema-datamodel packages/database/prisma/schema.prisma --exit-code || echo "Schema consistent"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t dom-bim-api:ci-${{ github.sha }} .

      - name: Start Redis sidecar
        run: |
          docker network create ci-net
          docker run -d --name ci-redis --network ci-net redis:7-alpine
          # Wait for Redis to be ready
          for i in 1 2 3 4 5; do
            docker exec ci-redis redis-cli ping && break || sleep 1
          done

      - name: Smoke-test API container
        run: |
          docker run -d --name ci-smoke --network ci-net \
            -e NODE_ENV=development \
            -e PORT=8080 \
            -e SESSION_SECRET=ci-test-session-secret-32chars-min \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e APS_MOCK=true \
            -e REDIS_HOST=ci-redis \
            -e REDIS_PORT=6379 \
            -e DATABASE_URL=postgresql://ci:ci@localhost:5432/ci \
            dom-bim-api:ci-${{ github.sha }}
          # Give the server time to start (matches Dockerfile HEALTHCHECK start-period)
          sleep 5
          echo "=== Container status ==="
          docker ps -a --filter name=ci-smoke
          echo "=== Container logs ==="
          docker logs ci-smoke 2>&1 | tail -30
          # Accept 200 (all up) or 503 (DB down but server started) as valid
          HTTP_CODE=$(docker exec ci-smoke wget -q -O /dev/null -S http://localhost:8080/health 2>&1 | grep 'HTTP/' | awk '{print $2}' | tail -1) || true
          echo "Health endpoint returned: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "503" ]; then
            echo "✅ Smoke test passed (HTTP $HTTP_CODE)"
          else
            echo "❌ Smoke test failed — expected 200 or 503, got: $HTTP_CODE"
            docker logs ci-smoke 2>&1
            exit 1
          fi

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f ci-smoke ci-redis 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true
