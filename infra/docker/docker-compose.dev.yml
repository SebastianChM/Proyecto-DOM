version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: dom-dev-db
    ports:
      - "127.0.0.1:5432:5432" # Bind to localhost only for security
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dom_bim}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dom}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dom-dev-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dom-dev-redis
    ports:
      - "127.0.0.1:6379:6379" # Bind to localhost only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dom-dev-net
    restart: unless-stopped

volumes:
  postgres_data_dev:

networks:
  dom-dev-net:
    driver: bridge
