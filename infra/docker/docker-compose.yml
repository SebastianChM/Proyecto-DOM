services:
  postgres:
    image: postgres:15-alpine
    container_name: dom-bim-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dom_bim}
      POSTGRES_USER: ${POSTGRES_USER:-dom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dom} -d ${POSTGRES_DB:-dom_bim}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # Resource limits require `docker compose --compatibility` or Swarm mode.
    # Documented here for reference:
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M
    #     reservations:
    #       memory: 256M
    networks:
      - dom-network

  redis:
    image: redis:7-alpine
    container_name: dom-bim-redis
    command: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: 256M
    #     reservations:
    #       memory: 128M
    networks:
      - dom-network

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: dom-bim-api
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.5"
    #       memory: 1G
    #     reservations:
    #       memory: 512M
    networks:
      - dom-network

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: dom-bim-worker
    command: ["node", "dist/src/worker.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 768M
    #     reservations:
    #       memory: 256M
    networks:
      - dom-network

volumes:
  postgres_data:
  redis_data:

networks:
  dom-network:
    driver: bridge
