version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: dom-bim-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dom_bim}
      POSTGRES_USER: ${POSTGRES_USER:-dom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dom-network

  redis:
    image: redis:7-alpine
    container_name: dom-bim-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    networks:
      - dom-network

  api:
    build: ./api
    container_name: dom-bim-api
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - postgres
      - redis
    networks:
      - dom-network

  worker:
    build: ./api
    container_name: dom-bim-worker
    command: npm run start:worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - postgres
      - redis
      - api
    networks:
      - dom-network

volumes:
  postgres_data:
  redis_data:

networks:
  dom-network:
    driver: bridge
